<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsbolgi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030101;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(rgba(3, 1, 1, 0.78), rgba(3, 1, 1, 0.94)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(8, 2, 3, 0.92);
            border: 1px solid #ff0033;
            padding: 30px 20px;
            box-shadow: 0 0 25px rgba(255, 0, 51, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 0, 51, 0.3);
            padding-bottom: 20px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #ff0033;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            display: block;
            width: 100%;
            background: #110305;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 15px;
            border: 1px solid #3a0d14;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .link-btn:hover, .link-btn:active {
            background: #ff0033;
            color: #000000;
            border-color: #ff0033;
            font-weight: bold;
        }

        details {
            border: 1px solid #3a0d14;
            background: #110305;
        }

        summary {
            padding: 12px 15px;
            font-size: 13px;
            color: #ff4d6d;
            cursor: pointer;
            text-align: center;
            list-style: none;
            letter-spacing: 0.5px;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary:hover {
            background: rgba(255, 0, 51, 0.1);
            color: #ffffff;
        }

        .sub-links {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #3a0d14;
        }

        .sub-btn {
            display: block;
            padding: 10px 15px;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 12px;
            border-bottom: 1px solid rgba(58, 13, 20, 0.4);
            transition: 0.2s;
        }

        .sub-btn:hover, .sub-btn:active {
            background: rgba(255, 0, 51, 0.15);
            color: #ffffff;
            padding-left: 20px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 10px;
            color: #666666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">itsbolgi</div>
            <div class="subtitle">İzleyici & Küçük Tasarımcı</div>
        </div>

        <div class="menu">
            <a href="https://kick.com/itskocgurbuz" target="_blank" class="link-btn">KICK / itskocgurbuz</a>
            <a href="https://kick.com/itsB0lg" target="_blank" class="link-btn">KICK / itsB0lg</a>

            <details>
                <summary>+ KÜÇÜK TASARIMCI & SOSYAL</summary>
                <div class="sub-links">
                    <a href="https://discord.gg/bolg" target="_blank" class="sub-btn">> Discord Sunucusu</a>
                    <a href="https://www.instagram.com/itsbolg" target="_blank" class="sub-btn">> Instagram (@itsbolg)</a>
                    <a href="https://www.instagram.com/dyt.emirhanbolgun?psln=Z2EydXZreWRza3g2" target="_blank" class="sub-btn">> Instagram (@dyt.emirhanbolgun)</a>
                    <a href="https://youtube.com/@emirhanbolgun?si=o-TwaSK8aywSzCMk" target="_blank" class="sub-btn">> YouTube Kanalı</a>
                </div>
            </details>
        </div>

        <div class="footer">
            [ ITSBOLGI // 2026 ]
        </div>
    </div>

</body>
</html>
